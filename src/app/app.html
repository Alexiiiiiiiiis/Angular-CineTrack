<header class="topbar">
  <h1>CinéTrack 🎵</h1>
  <button class="add-btn" (click)="showForm.set(!showForm())">
    {{ showForm() ? '✕ Fermer' : '➕ Ajouter un morceau' }}
  </button>
</header>

@if (showForm()) {
  <app-track-form (add)="addTrack($event)" />
}

<app-track-list [tracks]="tracks()" (remove)="removeTrack($event)" />
