<header class="topbar">
  <a routerLink="/tracks" class="brand"><h1>CinéTrack 🎵</h1></a>
  <nav class="nav">
    <a routerLink="/tracks" routerLinkActive="active">Bibliothèque</a>
    <a routerLink="/tracks/new" routerLinkActive="active">➕ Ajouter</a>
  </nav>

  <div class="auth">
    @if (auth.isLoggedIn()) {
      <span class="ok">👤 {{ auth.user()?.name ?? 'Connecté' }}</span>
      <button type="button" (click)="auth.logout()">Se déconnecter</button>
    } @else {
      <a routerLink="/login" class="login-link">Se connecter</a>
    }
  </div>
</header>

<main class="content">
  <router-outlet />
</main>

<app-toasts />
