<!-- F9 : recherche côté serveur -->
<app-track-search />

<!-- Recherche client (J2) -->
<input
  class="search"
  type="search"
  placeholder="Filtrer la bibliothèque (titre ou artiste)…"
  [value]="searchTerm()"
  (input)="searchTerm.set($any($event.target).value)" />

<section class="grid">
  @for (track of filteredTracks(); track track.id) {
    <app-track-card
      [track]="track"
      [canDelete]="auth.isLoggedIn()"
      (select)="openDetail($event.id)"
      (remove)="removeTrack($event.id)" />
  } @empty {
    <p>Aucun résultat pour « {{ searchTerm() }} ».</p>
  }
</section>
