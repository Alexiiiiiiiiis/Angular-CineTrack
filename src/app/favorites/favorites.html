<header class="page-head">
  <h2>♥ Mes favoris</h2>
  <span class="count">{{ favorites().length }} morceau(x)</span>
</header>

@if (loading()) {
  <p class="empty">Chargement…</p>
} @else {
  <section class="grid">
    @for (track of favorites(); track track.id) {
      <app-track-card
        [track]="track"
        [canDelete]="auth.isLoggedIn()"
        (select)="openDetail($event.id)"
        (toggleFav)="removeFavorite($event)" />
    } @empty {
      <p class="empty">Aucun favori pour le moment. Ajoutez-en depuis la bibliothèque ♡</p>
    }
  </section>
}
